name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm test` s'appuie sur l'effacement de types (--experimental-strip-types),
          # disponible à partir de Node 22.6 : sur Node 20 la commande échoue.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build static site
        run: npm run build
        env:
          # Valeurs de test : le build ne doit pas dépendre du domaine de production.
          NEXT_PUBLIC_BASE_PATH: /sensdelamarche
          NEXT_PUBLIC_SITE_URL: https://emilieclary.github.io/sensdelamarche
